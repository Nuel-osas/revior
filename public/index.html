<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revoir: see every offer again</title>
<meta name="description" content="Revoir remembers what a recruiter or collaborator told you, and shows you exactly what changed, with sources, before your next step." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f7f4ee; --card: #fffdf9; --ink: #16141c; --ink2: #3b3846; --muted: #7a7585; --line: #e6e0d4; --line2: #d9d1c2;
    --then: #8d8799; --now: #c2410c; --now-soft: #fff1e8; --now-line: #f4c9ad;
    --check: #0f766e; --check-soft: #e3f4f1; --warn: #a16207; --warn-soft: #fdf3d8;
    --ok: #15803d; --ok-soft: #e4f5e9;
    --serif: Inter, -apple-system, "Segoe UI", sans-serif; --sans: Inter, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sans); }
  a { color: inherit; }
  button { font: 600 14px var(--sans); border: 0; border-radius: 999px; padding: 10px 18px; background: var(--ink); color: var(--paper); cursor: pointer; transition: transform .12s ease, opacity .12s; }
  button:hover { transform: translateY(-1px); }
  button:active { transform: none; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line2); }
  button.text { background: none; color: var(--ink2); padding: 4px 6px; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
  button.danger { background: #b42318; }
  button:disabled { opacity: .5; cursor: wait; transform: none; }
  textarea, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; width: 100%; }
  textarea:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: transparent; }
  .serif { font-family: var(--sans); font-weight: 700; letter-spacing: -.02em; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tag { font: 500 13px var(--sans); color: var(--muted); }
  .src { display: inline-flex; align-items: center; font: 600 12px var(--sans); padding: 1px 7px; border-radius: 6px; background: #efe9de; color: var(--ink2); cursor: pointer; border: 1px solid var(--line); vertical-align: 1px; }
  .src:hover { background: var(--ink); color: var(--paper); }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line2); border-top-color: var(--ink); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .45s ease both; }

  .top { position: sticky; top: 0; z-index: 5; background: rgba(247,244,238,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 14px; }
  .logo { font: 700 21px/1 var(--sans); letter-spacing: -.02em; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .logo i { font-style: normal; color: var(--now); }
  .top .sp { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); text-decoration: none; cursor: pointer; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--line); object-fit: cover; }

  .land { max-width: 1120px; margin: 0 auto; padding: 56px 24px 80px; display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
  .land h1 { font: 700 clamp(34px, 4.2vw, 48px)/1.12 var(--sans); text-wrap: balance; margin: 0 0 18px; letter-spacing: -.03em; }
  .land h1 em { color: var(--now); font-style: normal; }
  .land p.lead { font-size: 18px; line-height: 1.6; color: var(--ink2); max-width: 520px; margin: 0 0 28px; }
  .gbtn { display: inline-flex; align-items: center; gap: 12px; padding: 13px 22px; font-size: 15px; }
  .gbtn svg { background: #fff; border-radius: 50%; padding: 3px; }
  .promise { list-style: none; padding: 0; margin: 34px 0 0; display: grid; gap: 10px; }
  .promise li { display: flex; gap: 12px; color: var(--ink2); }
  .promise b { font: 600 13px var(--sans); color: var(--muted); min-width: 22px; padding-top: 2px; }
  .demo { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 30px 60px -30px rgba(22,20,28,.25); }
  .bubble { border-radius: 16px; padding: 12px 15px; margin: 8px 0; max-width: 92%; font-size: 14.5px; }
  .bubble.them { background: #f1ece2; }
  .bubble small { display: block; font: 500 12px var(--sans); color: var(--muted); margin-bottom: 3px; }

  .tn { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--now-line); border-radius: 14px; overflow: hidden; margin: 10px 0; background: var(--card); }
  .tn > div { padding: 12px 14px; }
  .tn .then { border-right: 1px dashed var(--now-line); }
  .tn .then .q { color: var(--then); text-decoration: line-through; text-decoration-color: rgba(194,65,12,.45); }
  .tn .now { background: var(--now-soft); }
  .tn .now .q { color: var(--ink); }
  .tn .q { font: 500 15.5px/1.45 var(--sans); margin: 4px 0 6px; }
  .tn .cap { grid-column: 1 / -1; padding: 9px 14px; border-top: 1px solid var(--now-line); font-size: 13.5px; color: var(--ink2); display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--card); }
  .tn.soft { border-color: var(--line2); }
  .tn.soft .now { background: var(--warn-soft); }
  .tn.soft .then .q { text-decoration: none; }
  .meter { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--sans); color: var(--muted); white-space: nowrap; }
  .meter span { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter span i { display: block; height: 100%; background: var(--now); }
  .next { display: flex; gap: 12px; background: var(--check-soft); border-radius: 12px; padding: 12px 14px; margin-top: 10px; color: #0b4f49; }
  .next .ic { font: 700 18px/1 var(--sans); color: var(--check); }

  .narrow { max-width: 560px; margin: 8vh auto; padding: 0 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px; }
  .panel h2 { font: 700 28px/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 12px; }
  .steps { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
  .steps li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .steps li.on { color: var(--ink); }
  .steps li.done { color: var(--ok); }
  .steps .b { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font: 600 12px var(--sans); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 34px 24px 80px; }
  .hello { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .hello h1 { font: 700 34px/1.15 var(--sans); letter-spacing: -.02em; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .ocard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; display: flex; flex-direction: column; gap: 10px; min-height: 168px; }
  .ocard:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 18px 30px -24px rgba(22,20,28,.4); }
  .ocard h3 { font: 600 19px/1.3 var(--sans); letter-spacing: -.01em; margin: 0; }
  .ocard .st { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font: 600 12px var(--sans); padding: 3px 8px; border-radius: 999px; background: #efe9de; color: var(--ink2); }
  .badge.now { background: var(--now-soft); color: var(--now); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .newcard { border-style: dashed; align-items: center; justify-content: center; text-align: center; color: var(--ink2); }
  .newcard .plus { font: 300 36px/1 var(--sans); }

  .ohead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ohead h1 { font: 700 28px/1.2 var(--sans); letter-spacing: -.02em; margin: 0; flex: 1; min-width: 240px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 26px; align-items: start; }
  .thread { display: grid; gap: 14px; }
  .msg { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; }
  .rail { position: relative; display: flex; flex-direction: column; align-items: center; }
  .rail .sid { font: 600 12px var(--sans); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 4px 8px; }
  .rail::after { content: ""; flex: 1; width: 1px; background: var(--line2); margin-top: 6px; }
  .msg:last-child .rail::after { display: none; }
  .theirs { background: #f1ece2; border-radius: 4px 16px 16px 16px; padding: 13px 16px; white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; }
  .meta { font: 400 12.5px var(--sans); color: var(--muted); margin: 6px 2px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meta a { color: var(--check); }
  .look { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-top: 12px; }
  .look .kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .look .kicker .eye { font: 600 14px/1 var(--sans); color: var(--now); }
  .look h4 { font: 600 17px/1.45 var(--sans); margin: 0 0 6px; }
  .look .base { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .look .base span { font-size: 13px; background: #f3efe7; border-radius: 999px; padding: 4px 10px; }
  .unknown { margin-top: 10px; font-size: 14px; color: var(--ink2); }
  details.trace { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  details.trace summary { cursor: pointer; list-style: none; }
  details.trace summary::before { content: "+ "; }
  details.trace[open] summary::before { content: "− "; }
  .jrow { font: 12.5px/1.5 var(--sans); padding: 6px 0; border-top: 1px dashed var(--line); }
  .composer { position: sticky; bottom: 0; padding: 16px 0 20px; background: linear-gradient(to top, var(--paper) 72%, transparent); }
  .composer .box { background: var(--card); border: 1px solid var(--line2); border-radius: 18px; padding: 10px; box-shadow: 0 10px 30px -20px rgba(22,20,28,.35); }
  .composer textarea { border: 0; min-height: 70px; resize: vertical; background: transparent; }
  .composer textarea:focus { outline: none; }
  .composer .row { display: flex; align-items: center; gap: 10px; padding: 4px 6px 2px; }
  .composer .row .small { flex: 1; }
  .working { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .working li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
  .working li.on { color: var(--ink); }
  .working li.done { color: var(--ok); }
  .working .b { width: 13px; text-align: center; }

  .deal { position: sticky; top: 76px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .deal header { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  .deal header h3 { font: 700 18px/1.3 var(--sans); margin: 0; }
  .term { padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .term:last-child { border-bottom: 0; }
  .term .h { display: flex; justify-content: space-between; align-items: center; }
  .term .cur { margin-top: 3px; font-size: 14.5px; }
  .term .was { margin-top: 4px; font-size: 13px; color: var(--then); }
  .term .was s { text-decoration-color: rgba(194,65,12,.5); }
  .term .act { font: 600 11.5px var(--sans); color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 5px; margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty .serif { font-size: 20px; color: var(--ink); display: block; margin-bottom: 6px; }

  .modal { position: fixed; inset: 0; background: rgba(22,20,28,.42); display: none; align-items: flex-start; justify-content: center; padding: 9vh 16px 16px; z-index: 30; }
  .modal.open { display: flex; }
  .modal .panel { width: min(580px, 100%); max-height: 80vh; overflow-y: auto; animation: rise .25s ease both; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13.5px; margin: 14px 0; }
  .kv a { font-family: var(--mono); font-size: 12.5px; color: var(--check); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; display: none; z-index: 40; }
  .flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 4px var(--now-line); } }

  @media (max-width: 980px) {
    .land { grid-template-columns: 1fr; padding-top: 30px; gap: 34px; }
    .split { grid-template-columns: 1fr; }
    .deal { position: static; }
    .msg { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
    .tn { grid-template-columns: 1fr; }
    .tn .then { border-right: 0; border-bottom: 1px dashed var(--now-line); }
    .top .in, .wrap { padding-left: 16px; padding-right: 16px; }
  }
  /* ================= landing (SaaS style) ================= */
  .lp { background: #fff; color: #14121c; }
  .lp-nav { max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; gap: 28px; }
  .lp-brand { display: inline-flex; align-items: center; gap: 10px; font: 700 21px var(--sans); letter-spacing: -.02em; text-decoration: none; color: #14121c; }
  .lp-mark { width: 34px; height: 34px; border-radius: 10px; background: #14121c; display: inline-flex; align-items: center; justify-content: center; }
  .lp-links { flex: 1; display: flex; justify-content: center; gap: 30px; }
  .lp-links a { text-decoration: none; color: #2b2838; font-weight: 500; font-size: 15px; }
  .lp-links a:hover { color: #6d28d9; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; padding: 9px 10px 9px 20px; font: 600 15px var(--sans); text-decoration: none; border: 1px solid #e5e2ee; background: #fff; color: #14121c; cursor: pointer; }
  .pill .arr { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; }
  .pill.dark { background: #14121c; color: #fff; border-color: #14121c; padding: 11px 12px 11px 22px; }
  .pill.dark .arr { background: #fff; color: #14121c; border: 0; }
  .pill:hover { transform: translateY(-1px); }
  .lp-hero { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .lp-hero .bg { position: relative; border-radius: 32px; padding: 64px 24px 0; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, #5b21d6 0%, #7c3aed 38%, #b49bf5 70%, #f3eefe 100%); }
  .lp-hero .bg::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: linear-gradient(180deg, #000 0%, #000 55%, transparent 85%); }
  .spark { position: absolute; width: 22px; height: 22px; pointer-events: none; opacity: .75; }
  .spark::before, .spark::after { content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .spark::before { width: 1.5px; height: 22px; } .spark::after { width: 22px; height: 1.5px; }
  .badge-pill { position: relative; display: inline-flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 16px 6px 6px; font: 500 14.5px var(--sans); color: #14121c; box-shadow: 0 6px 20px -8px rgba(30,10,80,.4); }
  .badge-pill .dots { display: inline-flex; }
  .badge-pill .dots span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--sans); color: #fff; }
  .badge-pill .dots span:first-child { margin-left: 0; }
  .lp h1 { position: relative; font: 600 clamp(38px, 5.6vw, 70px)/1.08 var(--sans); letter-spacing: -.035em; color: #fff; margin: 26px auto 18px; max-width: 980px; text-wrap: balance; }
  .lp h1 .gem { display: inline-flex; align-items: center; justify-content: center; width: .95em; height: .95em; background: #14121c; transform: rotate(45deg); border-radius: 14%; vertical-align: -.08em; margin: 0 .12em; }
  .lp h1 .gem svg { transform: rotate(-45deg); width: 52%; height: 52%; }
  .lp .sub { position: relative; color: rgba(255,255,255,.9); font-size: 18px; max-width: 640px; margin: 0 auto 30px; }
  .lp-mock { position: relative; max-width: 1080px; margin: 54px auto 0; background: rgba(255,255,255,.5); border-radius: 26px; padding: 14px; box-shadow: 0 40px 80px -30px rgba(40,10,110,.45); text-align: left; }
  .lp-app { background: #f8f6fd; border-radius: 18px; display: grid; grid-template-columns: 64px 300px minmax(0, 1fr); min-height: 470px; overflow: hidden; }
  .lp-rail { padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; border-right: 1px solid #ece8f6; }
  .lp-rail i { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; color: #6b6780; box-shadow: 0 2px 8px -4px rgba(30,10,80,.25); font-style: normal; }
  .lp-rail i.on { background: #6d28d9; color: #fff; }
  .lp-list { padding: 22px 18px; border-right: 1px solid #ece8f6; }
  .lp-list h5 { margin: 0 0 14px; font: 600 18px var(--sans); }
  .lp-list .day { font: 500 13px var(--sans); color: #7a7690; margin: 14px 0 8px; }
  .lp-card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 6px 18px -12px rgba(30,10,80,.35); margin-bottom: 10px; }
  .lp-card .t { font: 600 15px var(--sans); }
  .lp-card .s { font-size: 13px; color: #7a7690; margin-top: 2px; }
  .lp-card .b { display: inline-block; margin-top: 8px; font: 600 12px var(--sans); padding: 3px 9px; border-radius: 999px; background: #fff1e8; color: #c2410c; }
  .lp-card .b.ok { background: #e4f5e9; color: #15803d; }
  .lp-chat { padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; }
  .lp-chat .hd { display: flex; align-items: center; justify-content: space-between; font: 600 18px var(--sans); margin-bottom: 4px; }
  .lp-chat .hd span { font: 500 13px var(--sans); color: #7a7690; }
  .lp-msg { align-self: flex-end; max-width: 78%; background: #ede7fb; border-radius: 16px 16px 4px 16px; padding: 11px 14px; font-size: 14px; }
  .lp-bot { display: flex; gap: 12px; align-items: flex-start; }
  .lp-bot .av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #6d28d9; display: inline-flex; align-items: center; justify-content: center; }
  .lp-bot .body { flex: 1; min-width: 0; font-size: 14.5px; }
  .lp-bot .tn { margin-top: 8px; }
  .lp-bot .tn .q { font-size: 14px; }
  .lp-trust { text-align: center; padding: 56px 20px 10px; }
  .lp-trust p { color: #5d5970; margin: 0 0 22px; }
  .lp-logos { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px 46px; font: 700 21px var(--sans); color: #2b2838; letter-spacing: -.02em; }
  .lp-logos span { display: inline-flex; align-items: center; gap: 9px; }
  .lp-logos b { width: 22px; height: 22px; border-radius: 6px; display: inline-block; }
  .lp-sec { max-width: 1160px; margin: 0 auto; padding: 90px 24px 10px; }
  .lp-sec h2 { font: 700 clamp(30px, 3.8vw, 46px)/1.15 var(--sans); letter-spacing: -.03em; text-align: center; margin: 0 auto 12px; max-width: 760px; text-wrap: balance; }
  .lp-sec .lede { text-align: center; color: #5d5970; font-size: 17px; max-width: 640px; margin: 0 auto 44px; }
  .lp-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .lp-feat { background: #f7f5fc; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
  .lp-feat .ic { width: 40px; height: 40px; border-radius: 11px; background: #ede7fb; color: #6d28d9; display: inline-flex; align-items: center; justify-content: center; }
  .lp-feat h3 { margin: 6px 0 0; font: 700 19px var(--sans); letter-spacing: -.01em; }
  .lp-feat p { margin: 0; color: #5d5970; font-size: 15px; }

  /* ---- reference-matched sections ---- */

  .lst i { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; flex: none; }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }

  .gcard h3 { font: 600 28px/1.2 var(--sans); letter-spacing: -.02em; margin: 0; }
  .gcard p { margin: 0; color: #3b3846; font-size: 16.5px; }
  .gcard .ui { background: #fff; border-radius: 22px; padding: 22px; margin-top: 14px; }
  .chat-mini { display: grid; gap: 12px; }
  .chat-mini .l, .chat-mini .r { max-width: 82%; padding: 9px 13px; border-radius: 12px; font-size: 14px; }
  .chat-mini .l { background: #f2f2f5; }
  .chat-mini .r { background: #d6cbfa; justify-self: end; }

  .receipt-wrap .ghost-card { position: absolute; width: 74%; height: 210px; border: 2px dashed #f1df9c; border-radius: 20px; background: #fff; transform: rotate(-3deg); }
  .receipt { position: relative; width: 78%; background: #fdeab4; border-radius: 20px; padding: 22px; transform: rotate(4deg); box-shadow: 0 20px 34px -24px rgba(80,60,0,.5); font-size: 13.5px; }
  .receipt .k { color: #6b5d2e; font-size: 12px; }
  .receipt .v { font-family: var(--mono); font-size: 12.5px; margin-bottom: 8px; word-break: break-all; }
  .wide { background: #f5f5f7; border-radius: 30px; padding: 54px 0 0 68px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 44px; overflow: hidden; margin-top: 26px; }
  .wide h3 { font: 600 30px/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 16px; }
  .wide p { color: #3b3846; font-size: 17px; margin: 0 0 26px; }
  .wide .panel2 { background: #d3ece6; border-radius: 26px 0 0 0; padding: 36px 0 30px 34px; display: grid; grid-template-columns: 180px 1fr; gap: 26px; }
  .checks { display: grid; gap: 16px; align-content: start; font-size: 15px; }
  .checks span { display: flex; gap: 10px; align-items: center; }

  .txs { background: #fff; border-radius: 22px 0 0 22px; padding: 16px 20px; display: grid; gap: 2px; }
  .txs .row { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid #f0eef5; }
  .txs .row:last-child { border-bottom: 0; }
  .txs .dot { width: 18px; height: 18px; border-radius: 50%; background: #6d28d9; flex: none; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .txs .t { font-weight: 600; font-size: 15px; }
  .txs .m { font-size: 13px; color: #8a8698; font-family: var(--mono); }
  .faq { display: grid; grid-template-columns: 1fr 1.15fr; gap: 50px; align-items: start; }

  .faq .lede { text-align: left !important; margin: 0 !important; }
  .faq details { border-radius: 22px; padding: 26px 32px; margin-bottom: 8px; }
  .faq details[open] { background: #f5f5f7; }
  .faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font: 600 19px var(--sans); }
  .faq summary::after { content: "+"; font: 300 30px/1 var(--sans); }
  .faq details[open] summary::after { content: "−"; }
  .faq details p { color: #4b4858; margin: 14px 0 0; font-size: 16px; line-height: 1.7; }
  .cta2 { max-width: 1200px; margin: 100px auto 0; padding: 0 20px; }
  .cta2 .in { border-radius: 30px; background: linear-gradient(180deg, #5b21d6, #a888f2); color: #fff; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 70px 0 0 90px; overflow: hidden; position: relative; }
  .cta2 h2 { font: 600 clamp(30px, 3.6vw, 46px)/1.12 var(--sans); letter-spacing: -.03em; margin: 0 0 14px; }
  .cta2 p { color: rgba(255,255,255,.88); font-size: 17px; margin: 0 0 28px; max-width: 400px; }
  .cta2 .in > div { position: relative; z-index: 1; }
  .spark { z-index: 0; }
  .phone { justify-self: center; width: 290px; height: 400px; border-radius: 46px 46px 0 0; background: #111; padding: 12px 12px 0; box-shadow: 0 -10px 40px -10px rgba(20,0,60,.5); }
  .phone .scr { background: #f8f7fb; border-radius: 36px 36px 0 0; height: 100%; padding: 22px 18px; color: #14121c; }
  .phone .stat { display: flex; justify-content: space-between; font: 600 11px var(--sans); color: #444; }
  .phone h4 { font: 500 26px/1.15 var(--sans); letter-spacing: -.02em; margin: 26px 0 4px; }
  .phone h4 span { color: #9a96a8; }
  .phone .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .phone .tiles div { border-radius: 16px; padding: 12px; font-size: 12.5px; font-weight: 600; min-height: 74px; }
  .foot2 { max-width: 1200px; margin: 0 auto; padding: 70px 24px 50px; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }
  .foot2 p { color: #5d5970; font-size: 15px; line-height: 1.7; max-width: 260px; }
  .foot2 h6 { margin: 0 0 16px; font: 400 15px var(--sans); color: #6b6780; }
  .foot2 a { display: block; text-decoration: none; color: #14121c; font-weight: 500; margin-bottom: 12px; }
  .foot2 .legal { grid-column: 1 / -1; border-top: 1px solid #ece8f6; padding-top: 22px; color: #8a8698; font-size: 13.5px; }
  @media (max-width: 980px) {
    .tri, .duo, .faq { grid-template-columns: 1fr; }
    .wide { grid-template-columns: 1fr; padding: 36px 0 0 28px; }
    .wide .panel2 { grid-template-columns: 1fr; }
    .gcard { padding: 32px 26px; }
    .cta2 .in { grid-template-columns: 1fr; padding: 48px 0 0 28px; }
    .foot2 { grid-template-columns: 1fr 1fr; }
  }
  /* ================= Walrus palette (walrus.xyz) ================= */
  :root {
    --w-black: #000000; --w-ink: #14181b; --w-surface: #1d2227; --w-cream: #faf8f5; --w-lav: #cab1ff;
    --w-blue: #3395ee; --w-violet: #5e0eff; --w-indigo: #1a1437; --w-grey: #8e9294; --w-grey2: #b1b4b6;
    --w-grad: linear-gradient(90deg, #3395ee 0%, #5e0eff 90%);
    --sans: "Google Sans Flex", "Google Sans", -apple-system, "Segoe UI", sans-serif;
    --serif: var(--sans);
    --mono: "Google Sans Code", ui-monospace, Menlo, monospace;
    /* app (light) */
    --paper: #faf8f5; --card: #ffffff; --ink: #000000; --ink2: #2b3035; --muted: #6f7477; --line: #ebe7e0; --line2: #ddd8cf;
    --then: #8e9294; --now: #5e0eff; --now-soft: #f2ecff; --now-line: #cab1ff;
    --check: #1f6fd1; --check-soft: #e8f2fd;
  }
  .logo i { color: var(--w-violet); }
  .tn .then .q { text-decoration-color: rgba(94,14,255,.45); }
  .term .was s { text-decoration-color: rgba(94,14,255,.5); }
  .meter span i { background: var(--w-grad); }
  .badge.now { background: var(--now-soft); color: var(--w-violet); }
  .next { color: #0f3f7a; }
  button { background: var(--w-black); color: var(--w-cream); }
  .chip .dot { background: var(--w-blue); }
  .rail .sid { background: var(--w-black); }

  /* landing (dark, like walrus.xyz) */
  .lp { background: var(--w-black); color: var(--w-cream); }
  .lp-brand, .foot2 a.lp-brand { color: var(--w-cream); }
  .lp-mark { background: none; width: auto; height: auto; }
  .lp-links a { color: var(--w-grey2); }
  .lp-links a:hover { color: var(--w-lav); }
  .pill { background: transparent; color: var(--w-cream); border: 1px solid rgba(250,248,245,.55); }
  .pill.dark { background: var(--w-cream); color: var(--w-black); border-color: var(--w-cream); }
  .pill.dark .arr { background: var(--w-black); color: var(--w-cream); }
  .lp-hero .bg { background: linear-gradient(180deg, var(--w-indigo) 0%, #2b1a86 34%, #5e0eff 66%, #000 100%); }
  .badge-pill { background: rgba(250,248,245,.1); color: var(--w-cream); border: 1px solid rgba(250,248,245,.22); box-shadow: none; backdrop-filter: blur(6px); }
  .badge-pill .dots span { border-color: var(--w-indigo); }
  .lp h1 { color: var(--w-cream); }
  .lp h1 .gem { background: var(--w-grad); }
  .lp .sub { color: rgba(250,248,245,.82); }
  .lp-mock { background: rgba(202,177,255,.18); box-shadow: 0 40px 90px -30px rgba(94,14,255,.55); }
  .lp-rail i.on, .lp-bot .av { background: var(--w-violet); }
  .lp-msg { background: #efe8ff; }
  .lp-card .b { background: var(--now-soft); color: var(--w-violet); }
  .lp-trust p, .lp-sec .lede { color: var(--w-grey2); }
  .lp-logos { color: var(--w-cream); }
  .lp-sec h2, .two-tone { color: var(--w-cream); }
  .two-tone span { color: var(--w-grey); }
  .tri .pink { background: var(--w-lav); }
  .tri .lav { background: var(--w-grad); }
  .tri .mint { background: var(--w-surface); }
  .tl .chg { color: var(--w-violet); }
  .gcard, .wide { background: var(--w-ink); }
  .gcard h3, .wide h3 { color: var(--w-cream); }
  .gcard p, .wide p { color: var(--w-grey2); }
  .chat-mini .r { background: var(--w-lav); }
  .receipt { background: var(--w-lav); }
  .receipt .k { color: #4a3a7a; }
  .receipt-wrap .ghost-card { border-color: rgba(202,177,255,.6); background: var(--w-surface); }
  .wide .panel2 { background: var(--w-lav); }
  .checks { color: var(--w-black); }
  .txs .dot { background: var(--w-violet); }
  .faq h2 { color: var(--w-cream); }
  .faq summary { color: var(--w-cream); }
  .faq details[open] { background: var(--w-ink); }
  .faq details p { color: var(--w-grey2); }
  .cta2 .in { background: var(--w-grad); }
  .cta2 .pill { background: var(--w-cream) !important; color: var(--w-black); border-color: var(--w-cream); }
  .foot2 p, .foot2 h6, .foot2 .legal { color: var(--w-grey); }
  .foot2 a { color: var(--w-cream); }
  .foot2 .legal { border-top-color: var(--w-surface); }
  .lp-err { background: var(--w-cream); }
  /* light UI surfaces inside the dark landing keep dark ink */
  .lp-app, .lp-card, .lp-msg, .stat-card, .tl, .lst div, .txs, .gcard .ui, .receipt, .phone .scr, .demo-in { color: var(--w-black); }
  .lp-app .lp-chat .hd, .lp-list h5 { color: var(--w-black); }
  .shot { display: flex; align-items: center; gap: 12px; padding: 8px 8px 10px; border-bottom: 1px dashed var(--line2); margin-bottom: 6px; font-size: 13.5px; color: var(--ink2); }
  .shot img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; }
  .shot span { flex: 1; }
  .shot[hidden] { display: none; }
  .composer .box.drag { outline: 2px dashed var(--now); outline-offset: 3px; }
  button.attach { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; font-weight: 500; }
  .scan { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .scan.danger { border-color: #f2b8b5; }
  .scan.caution { border-color: #f1d48a; }
  .scan-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scan-h a { font-weight: 600; text-decoration: none; }
  .scan-badge { font: 600 12.5px var(--sans); padding: 4px 10px; border-radius: 999px; background: #e4f5e9; color: #15803d; }
  .scan.danger .scan-badge { background: #fde7e6; color: #b42318; }
  .scan.caution .scan-badge { background: #fdf3d8; color: #a16207; }
  .scan-sum { margin: 10px 0 6px; font-size: 15px; }
  .scan-run { background: #fff7f6; border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
  .scan-run ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .finding { border-top: 1px dashed var(--line); padding: 10px 0 4px; }
  .finding .fh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .finding .sev { font: 600 11px var(--sans); text-transform: uppercase; padding: 1px 7px; border-radius: 6px; background: #f3efe7; color: var(--ink2); }
  .finding.high .sev { background: #fde7e6; color: #b42318; }
  .finding.medium .sev { background: #fdf3d8; color: #a16207; }
  .finding .loc { margin-left: auto; font: 500 12.5px var(--mono); color: var(--check); text-decoration: none; }
  .finding pre { margin: 6px 0 0; background: #14181b; color: #e6e1f5; border-radius: 10px; padding: 9px 11px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .hero-ctas { position: relative; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hero-ctas .pill:not(.dark) { gap: 9px; padding: 11px 20px; background: rgba(250,248,245,.08); }
  .scan-pitch { display: grid; grid-template-columns: .9fr 1.1fr; gap: 34px; align-items: center; }
  .scan-points { display: flex; flex-direction: column; gap: 20px; }
  .scan-points > div { display: flex; gap: 14px; }
  .scan-points .ic { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--w-grad); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .scan-points b { font-size: 17px; color: var(--w-cream); }
  .scan-points p { margin: 4px 0 0; color: var(--w-grey2); font-size: 15px; }
  .scan-points code, .scan-demo code { font-family: var(--mono); font-size: .92em; background: rgba(202,177,255,.16); padding: 1px 5px; border-radius: 5px; }
  .scan-demo { background: #fff; color: #000; border-radius: 24px; padding: 24px; box-shadow: 0 30px 70px -30px rgba(94,14,255,.6); border: 1px solid #f2b8b5; }
  .scan-demo code { background: #f3efe7; }
  .sd-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sd-badge { font-weight: 600; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #fde7e6; color: #b42318; }
  .sd-c { font-size: 12.5px; color: #8e9294; }
  .sd-sum { font-size: 14.5px; margin: 12px 0; color: #2b3035; }
  .sd-run { background: #fff7f6; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; }
  .sd-run ul { margin: 6px 0 0; padding-left: 18px; }
  .sd-t { font-size: 12.5px; color: #8e9294; }
  .sd-f { display: flex; gap: 8px; align-items: baseline; margin-top: 14px; font-size: 14.5px; flex-wrap: wrap; }
  .sd-f .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; background: #fde7e6; color: #b42318; }
  .sd-f .loc { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: #1f6fd1; }
  .scan-demo pre { margin: 6px 0 0; background: #14181b; color: #e6e1f5; border-radius: 10px; padding: 9px 11px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .sd-next { margin-top: 14px; background: #e8f2fd; color: #0f3f7a; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .sd-cov { margin-top: 10px; font-size: 12px; color: #8e9294; }
  @media (max-width: 980px) { .scan-pitch { grid-template-columns: 1fr; } }
  /* ---- phone layout ---- */
  .top .in > * { white-space: nowrap; }
  @media (max-width: 640px) {
    .top .in { gap: 8px; padding: 10px 14px; }
    .logo span { display: none; }
    #memBtn { font-size: 13px; padding: 4px 2px; }
    #outBtn { font-size: 13px; padding: 4px 2px; }
    .avatar { display: none; }
    .chip { font-size: 11.5px; padding: 4px 8px; }
    .wrap { padding: 20px 14px 60px; }
    .hello h1 { font-size: 28px; }
    .ohead { gap: 6px 10px; }
    .ohead h1 { order: -1; flex-basis: 100%; font-size: 24px; min-width: 0; }
    .composer .row { flex-wrap: wrap; }
    .composer .row .small { display: none; }
    .composer .row #send { margin-left: auto; }
    .tn .cap { flex-direction: column; align-items: flex-start; gap: 6px; }
    .look, .scan { padding: 14px; }
    .look h4 { font-size: 16px; }
    .msg { grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
    .rail .sid { font-size: 11px; padding: 3px 6px; }
    .finding .loc { margin-left: 0; }

          <details><summary>Will Revoir tell me if an offer is a scam?</summary><p>Yes. Every message gets a verdict: Likely scam, Suspicious, or No scam signals found, with a probability from Jev and the exact reasons: fees, pressure, moving you to Telegram, contradicted promises, repo red flags, and what other Revoir users reported. "No scam signals found" means nothing matched, not that an offer is guaranteed, so the next check is always there too.</p></details>

          <details><summary>Do I pay anything?</summary><p>No. Revoir sponsors the small fees for creating your wallet and memory account, and the Walrus Memory service pays for storage.</p></details>
          <details><summary>Can I take my memory with me?</summary><p>Yes. Export your wallet's private key from "My wallet" and import it into a Sui wallet. Whoever holds the key controls the memory account, including removing Revoir's access.</p></details>

// ---------- offer view ----------
function saved(e) {
  if (e.archive_status === "done") return `<a href="https://walruscan.com/mainnet/blob/${esc(e.blob_id)}" target="_blank">✓ remembered on Walrus</a>`;
  if (e.archive_status === "failed") return `<span style="color:#b42318">couldn't save to Walrus</span>`;
  return `<span><span class="spin" style="width:10px;height:10px"></span> saving to Walrus…</span>`;
}

function thenNow(c, a, used) {
  // Pair each explained change with the exact quotes Jev compared.
  // Several pairs can share the same S1 -> S2 sources, so pick the one whose quotes best match this change's wording.
  const words = (s) => new Set(String(s).toLowerCase().match(/[a-z0-9$]{3,}/g) || []);
  const what = words(c.what);
  const overlap = (j) => [...words(j.pair.prior.quote + " " + j.pair.current.quote)].filter((w) => what.has(w)).length;
  const pairs = (a.jev || []).filter((j) => j.pair.prior.source === c.prior && j.pair.current.source === c.current && !used.has(j.id));
  const p = pairs.sort((x, y) => overlap(y) - overlap(x) || (y.probabilities[c.relation] || 0) - (x.probabilities[c.relation] || 0))[0];
  if (p) used.add(p.id);
  const prob = p ? (p.probabilities[c.relation] ?? p.probabilities[p.choice] ?? 0) : null;
  return `<div class="tn ${c.relation === "change" ? "soft" : ""}">
    <div class="then"><div class="tag">Then · <span class="src" data-src="${esc(c.prior)}">${esc(c.prior)}</span></div><div class="q">${p ? `"${esc(p.pair.prior.quote)}"` : ""}</div></div>
    <div class="now"><div class="tag" style="color:${c.relation === "change" ? "var(--warn)" : "var(--now)"}">Now · <span class="src" data-src="${esc(c.current)}">${esc(c.current)}</span></div><div class="q">${p ? `"${esc(p.pair.current.quote)}"` : ""}</div></div>
    <div class="cap"><span>${esc(c.what)}</span>${prob !== null ? `<span class="meter" title="Jev's probability for this relation">${esc(c.relation)}<span><i style="width:${Math.round(prob * 100)}%;${c.relation === "change" ? "background:var(--warn)" : ""}"></i></span>${prob.toFixed(2)}</span>` : ""}</div>
  </div>`;
}

const KIND = { phone: "phone number", email: "email address", domain: "website", handle: "Telegram or social handle", wallet: "wallet address", repo: "GitHub repo" };
function renderVerdict(v) {
  if (!v) return "";
  const cls = v.level === "high" ? "v-high" : v.level === "medium" ? "v-med" : "v-low";
  const pct = typeof v.probability === "number" ? `<span class="v-p">${Math.round(v.probability * 100)}% scam likelihood</span>` : "";
  const comm = (v.community?.matches || []).filter((m) => m.scam_users || m.legit_users).map((m) =>
    `<li><b>${m.known_scam ? "Known scam indicator" : m.scam_users > m.legit_users ? "Reported before" : "Seen before"}:</b> this ${esc(KIND[m.kind] || m.kind)} (${esc(m.hint)}) was reported as a scam by ${m.scam_users} Revoir user${m.scam_users === 1 ? "" : "s"}${m.legit_users ? ` and as legit by ${m.legit_users}` : ""}.</li>`).join("");
  const sim = (v.community?.similar || []).slice(0, 2).map((p) =>
    `<li><b>Matches a pattern others reported as ${esc(p.outcome)}:</b> "${esc(p.summary.slice(0, 220))}${p.summary.length > 220 ? "…" : ""}"</li>`).join("");
  return `<div class="verdict ${cls}">
    <div class="v-h"><span class="v-label">${esc(v.label)}</span>${pct}</div>
    ${v.signals?.length ? `<div class="v-sig">${v.signals.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    ${comm || sim ? `<div class="v-well"><div class="tag">From the Revoir community</div><ul>${comm}${sim}</ul></div>` : ""}
  </div>`;
}

function renderLook(e) {
  const a = e.assessment;
  if (!a) return "";
  const used = new Set();
  const isFirst = !a.recall?.prior_events;
  const changes = (a.changes || []).map((c) => thenNow(c, a, used)).join("");
  const inside = (a.changes || []).some((c) => c.prior === c.current);
  const base = isFirst && !changes ? `<div class="base">${(e.claims || []).slice(0, 8).map((c) => `<span>${esc(c.statement)}</span>`).join("")}</div>` : "";
  const notes = changes ? "" : (a.notes || []).map((n) => `<p style="margin:8px 0 0">${esc(n.text)} ${(n.sources || []).map((s) => `<span class="src" data-src="${esc(s)}">${esc(s)}</span>`).join(" ")}</p>`).join("");
  const jev = (a.jev || []).map((j) => `<div class="jrow">${esc(j.pair.prior.source)} → ${esc(j.pair.current.source)} · ${esc(j.pair.topic)} · <b>${esc(j.choice)}</b> ${(j.probabilities[j.choice] ?? 0).toFixed(2)}<br/>"${esc(j.pair.prior.quote)}" vs "${esc(j.pair.current.quote)}"</div>`).join("");
  return `<div class="look">
    ${renderVerdict(a.verdict)}
    <div class="kicker"><span class="eye">Second look</span><span class="tag">${isFirst ? (inside ? "change found inside this message" : "baseline saved") : `${a.recall?.recalled_events ?? 0} earlier message${a.recall?.recalled_events === 1 ? "" : "s"} recalled from Walrus`}</span></div>
    <h4>${esc(a.headline)}</h4>
    ${base}${changes}${isFirst ? "" : notes}
    ${a.unknown ? `<div class="unknown"><span class="tag">Still unknown</span><br/>${esc(a.unknown)}</div>` : ""}
    ${a.next_check ? `<div class="next"><span class="ic">→</span><div><div class="tag" style="color:var(--check)">Next check</div>${esc(a.next_check)}</div></div>` : ""}
    <details class="trace"><summary>How Revoir decided</summary>
      <div class="jrow">Recall: ${a.recall?.recalled_events ?? 0} of ${a.recall?.prior_events ?? 0} earlier messages came back from Walrus Memory${a.recall?.error ? " (recall failed: comparison may be incomplete)" : ""}.</div>
      ${jev || `<div class="jrow">Nothing earlier to compare yet.</div>`}
      ${a.jev_error ? `<div class="jrow" style="color:#b42318">${esc(a.jev_error)}</div>` : ""}
      <div class="jrow">Models: ${esc(a.models?.extractor?.returned || "")} (reading, explaining) · ${esc(a.jev_model || "jev")} (comparing)</div>
    </details>
  </div>`;
}

function paintDeal() {

    (keys.length ? keys.map((k) => {
      const t = d[k], cur = t.current;
      const earlier = t.history.filter((h) => h.claim_id !== cur?.claim_id);
      return `<div class="term">
        <div class="h"><span class="tag">${TOPIC[k]}</span>${t.state === "conflicting_claims" ? `<span class="badge now">changed</span>` : ""}</div>

        ${earlier.map((h) => `<div class="was">${h.state === "superseded" || h.state === "withdrawn" ? `<s>${esc(h.statement)}</s> · ${esc(h.state)} by you` : h.state === "disputed" ? `Was: <s>${esc(h.statement)}</s>` : esc(h.statement)} <span class="src" data-src="${esc(h.source)}">${esc(h.source)}</span></div>`).join("")}
      </div>`;
    }).join("") : `<div class="empty small">Terms appear here as you paste messages, each linked to the message it came from.</div>`);

  $$("#deal [data-fix]").forEach((b) => (b.onclick = () => correct(b.dataset.fix)));
}

// ---------- GitHub repo scan ----------
const ghLink = (t) => (String(t).match(/https?:\/\/(www\.)?github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+[^\s)"'\]]*/) || [])[0] || null;
function repoHint() {
  const u = ghLink($("#msg").value), el = $("#repoHint");
  if (!u) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>This message links a GitHub repo. <b>Scan it before you clone or run anything.</b></span><button class="ghost attach" id="hintScan">Scan ${esc(u.replace(/^https?:\/\/(www\.)?github\.com\//, "").split(/[/?#]/).slice(0, 2).join("/"))}</button>`;
  $("#hintScan").onclick = () => scanRepo(u);

function askRepo() {

function renderScan(e) {
  const a = e.assessment || {};

  const at = a.commit || a.ref || "HEAD";
  const fileUrl = (f) => `https://github.com/${a.repo}/blob/${at}/${f.file}${f.line ? `#L${f.line}` : ""}`;
  return `<div class="scan ${L[1]}">
    ${renderVerdict(a.verdict)}
    <div class="scan-h"><span class="scan-badge">${L[0]}</span><a href="${esc(a.url)}" target="_blank">${esc(a.repo)}</a><span class="muted small">@ ${esc(String(at).slice(0, 7))}</span></div>
    <p class="scan-sum">${esc(a.summary)}</p>
    ${(a.install_behavior || []).length ? `<div class="scan-run"><div class="tag">Runs automatically when you install or open it</div><ul>${a.install_behavior.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
    ${(a.findings || []).map((f) => `<div class="finding ${esc(f.severity)}"><div class="fh"><span class="sev">${esc(f.severity)}</span><b>${esc(f.what)}</b><a class="loc" href="${esc(fileUrl(f))}" target="_blank">${esc(f.file)}${f.line ? `:${f.line}` : ""}</a></div><div class="small">${esc(f.why)}</div><pre>${esc(f.evidence)}</pre></div>`).join("")}
    ${(a.binaries || []).length ? `<div class="small" style="margin-top:8px"><b>Executable files in the repo:</b> ${a.binaries.map(esc).join(", ")}</div>` : ""}

    <div class="meta"><span>${when(e.recorded_at)}</span><span>${a.coverage?.rule_checked ?? 0} files rule-checked · ${a.coverage?.reviewed_by_model ?? 0} reviewed by DeepSeek · nothing executed</span>${saved(e)}</div>
  </div>`;
}

// Screenshot -> downscaled JPEG in the browser -> DeepSeek transcribes it -> you review the text before sending.
let shot = null; // { origin: "screenshot", platform }
function downscale(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.85));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("couldn't read that image"));
    img.src = URL.createObjectURL(file);
  });
}
async function readShot(file) {
  const el = $("#shot");
  try {
    const url = await downscale(file);
    el.hidden = false;
    el.innerHTML = `<img src="${url}" alt="" /><span><span class="spin"></span> Reading the screenshot…</span>`;
    const r = await api("transcribe", { id: current.id, image: url });
    if (!r.has_text || !r.transcript) { el.innerHTML = `<img src="${url}" alt="" /><span>No message text found in that image.</span><button class="text" id="shotX">remove</button>`; $("#shotX").onclick = clearShot; return; }
    const ta = $("#msg");
    ta.value = (ta.value.trim() ? ta.value.trim() + "\n\n" : "") + r.transcript;
    ta.style.height = Math.min(360, ta.scrollHeight + 4) + "px";
    shot = { origin: "screenshot", platform: r.platform };
    el.innerHTML = `<img src="${url}" alt="" /><span><b>Transcribed from ${esc(r.platform === "other" ? "screenshot" : r.platform)}.</b> Check the text below matches, and remove any codes or ID numbers, then send.</span><button class="text" id="shotX">remove</button>`;
    $("#shotX").onclick = () => { $("#msg").value = ""; clearShot(); };
    ta.focus();
  } catch (e) {
    el.hidden = false; el.innerHTML = `<span style="color:#b42318">${esc(e.message)}</span><button class="text" id="shotX">dismiss</button>`; $("#shotX").onclick = clearShot;
  }
}
function clearShot() { shot = null; const el = $("#shot"); if (el) { el.hidden = true; el.innerHTML = ""; } const f = $("#file"); if (f) f.value = ""; }

async function send() {
  const text = $("#msg").value.trim(); if (!text) return;
  const btn = $("#send"); btn.disabled = true;
  $("#thread .empty")?.remove();
  const n = current.timeline.filter((e) => e.kind === "source_message").length;
  $("#thread").insertAdjacentHTML("beforeend", `
    <div class="msg rise" id="pendingMsg"><div class="rail"><span class="sid">S${n + 1}</span></div><div>
      <div class="theirs">${esc(text)}</div>
      <div class="look"><ul class="working" id="working">
        <li><span class="spin"></span>Reading the message and quoting each claim</li>
        <li><span class="b">·</span>Recalling what they told you before, from Walrus</li>

        <li><span class="b">·</span>Writing your second look</li>
      </ul></div></div></div>`);
  $("#msg").value = "";
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  let k = 0;
  const steps = () => $$("#working li").forEach((li, i) => { li.className = i < k ? "done" : i === k ? "on" : ""; li.firstElementChild.outerHTML = i < k ? `<span class="b">✓</span>` : i === k ? `<span class="spin"></span>` : `<span class="b">·</span>`; });
  const t = setInterval(() => { if (k < 3) { k++; steps(); } }, n ? 2600 : 2200);
  try {
    await api("message", { id: current.id, text, idem: crypto.randomUUID(), ...(shot || {}) });
    clearShot();
    clearInterval(t);
    current = await api(`opportunity?id=${encodeURIComponent(current.id)}`);
    paintOffer();
    clearInterval(poll); poll = setInterval(refreshSaves, 5000);
  } catch (e) {
    clearInterval(t);
    $("#pendingMsg .look").innerHTML = `Couldn't analyze this: ${esc(e.message)}`;
    $("#msg").value = text; btn.disabled = false;
  }
}

async function refreshSaves() {
  if (!current || !location.hash.startsWith("#/o/")) return clearInterval(poll);
  const fresh = await api(`opportunity?id=${encodeURIComponent(current.id)}`).catch(() => null);
  if (!fresh) return;
  const changed = fresh.timeline.some((e, i) => e.archive_status !== current.timeline[i]?.archive_status);
  const typing = $("#msg")?.value;
  current = fresh;
  if (changed && !typing) paintOffer(true);
  if (!fresh.timeline.some((e) => e.archive_status === "pending")) clearInterval(poll);
}
